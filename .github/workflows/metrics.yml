name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Needed to push metrics SVG to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: master
          committer_message: "chore(metrics): update profile metrics [skip ci]"
          base: header, activity, community, repositories, metadata
          config_timezone: America/Denver

          # Enable useful plugins
          plugin_languages: yes
          plugin_achievements: yes
          plugin_followup: yes
          plugin_isocalendar: yes
          plugin_lines: yes

          # Optional visual tweaks
          config_display: large
          config_padding: 10, 20
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata
